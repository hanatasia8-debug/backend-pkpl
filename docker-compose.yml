services:
  postgres:
    image: postgres:16-alpine
    container_name: web_desa_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: web_desa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_desa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_desa_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/web_desa_db?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/web_desa_db?sslmode=disable"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../testing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-YOUR_GOOGLE_MAPS_API_KEY}"
    container_name: web_desa_frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
      INTERNAL_API_URL: "http://backend:3000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
